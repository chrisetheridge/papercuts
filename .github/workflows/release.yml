name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Increment version
        id: version
        shell: bash
        run: |
          plist="Resources/PapercutsMenuBar-Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          IFS=. read -r major minor patch <<< "$version"
          new_version="$major.$minor.$((patch + 1))"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $new_version" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $new_version" "$plist"

          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build app
        run: scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent .build/Papercuts.app "Papercuts-${{ steps.version.outputs.version }}-macos.zip"

      - name: Commit version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/PapercutsMenuBar-Info.plist
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" "Papercuts-${{ steps.version.outputs.version }}-macos.zip" --title "Papercuts ${{ steps.version.outputs.version }}" --generate-notes
